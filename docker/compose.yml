# SPDX-License-Identifier: Apache-2.0
#
# ch_table_engines' Compose project (ch_table_engines.md §2.1, §6): the dev
# images, and the containers every leg runs in.  test/run.sh drives it; the
# host builds images and starts containers, and nothing else (§1.2, rule 8).
#
#   chte-dev-vanilla   vanilla REL_19_STABLE: pg_accel/vexec-dev:vanilla and
#                      what Dockerfile.dev adds
#   vanilla            a leg's container on it: the tree read-only at /src,
#                      its run's directory at /work, the engine library at
#                      /engine, no network
#   chte-dev-official  Dockerfile.official: Docker Hub's postgres image of
#                      PostgreSQL 19 (CHTE_PG_IMAGE) and what a leg needs,
#                      from public sources only, its postgres the host's
#                      user's uid (CHTE_UID): GitHub Actions' image
#   official           a leg's container on it, as vanilla's
#   chte-dev-port     the port (CH6): the patched server with the port's
#                      modules, pg_accel/vexec-dev:port-<commit>, and what
#                      Dockerfile.dev adds
#   port               a leg's container on it, as vanilla's, and the port's
#                      modules built from a tree of the port (portbuild) at
#                      /cbstage where CHTE_PORT_STAGE names their stage
#   portbuild          test/portbuild.sh: the port's modules built from
#                      CHTE_PORT_SRC, a tree of the port, in pg_accel's
#                      portdev image, into CHTE_PORT_BUILD and staged there
#   chte-engine-builder  Dockerfile.engine: Debian trixie with Clang 21 from
#                      trixie-backports, for ClickHouse's sources
#   engine             test/engine.sh on it: ClickHouse v26.8.8.8-lts read-only
#                      at /ch, the build tree and ccache at /build (§2.2), as
#                      the host's user (CHTE_UID, CHTE_GID)
#
# PG_SRC is the build's checkout of PostgreSQL (pg_accel's
# test/vexec/checkouts.sh keeps it, ~/.cache/pg_accel/postgres), from which
# the image takes PostgreSQL's TAP modules at its server's own commit.
# CHTE_PORT_COMMIT is the port's commit its images were built from
# (pg_accel/cb-ext:<commit>, test/run.sh images port).

name: pg_chte

x-run: &run
  user: postgres
  network_mode: none
  shm_size: 2gb
  mem_limit: ${CHTE_MEM:-40g}
  memswap_limit: ${CHTE_MEM:-40g}
  cpus: ${CHTE_CPUS:-0}
  tmpfs:
    - /tmp:exec
  volumes:
    - ..:/src:ro
    - ${CHTE_WORK:-/nonexistent}:/work
    - ${CHTE_DATA:-/nonexistent}:/data:ro
    - ${CHTE_ENGINE_BUILD:-${HOME}/.cache/pg_accel/chte/engine}/lib:/engine:ro
  environment:
    CHTE_SRC: /src
    CHTE_WORK: /work
    MAKE_JOBS: ${MAKE_JOBS:-8}
    CHTE_TESTS: ${CHTE_TESTS:-}
    CHTE_SPECS: ${CHTE_SPECS:-}
    CHTE_TAP_TESTS: ${CHTE_TAP_TESTS:-}
    CHTE_SETTINGS: ${CHTE_SETTINGS:-}
    CHTE_BACKTRACE_ON_CRASH: ${CHTE_BACKTRACE_ON_CRASH:-}
    CHTE_HITS_ROWS: ${CHTE_HITS_ROWS:-}
    CHTE_BATCH_PAGES: ${CHTE_BATCH_PAGES:-}
    CHTE_PRELOAD: ${CHTE_PRELOAD:-}
    CHTE_SEGMENTS: ${CHTE_SEGMENTS:-}
    CHTE_CLUSTER_PARTS: ${CHTE_CLUSTER_PARTS:-}
    CHTE_ENGINE: /engine/libchte_engine.so

services:
  chte-dev-vanilla:
    image: pg_chte/dev:${CHTE_VANILLA_FLAVOR:-vanilla}
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts:
        pgsrc: ${PG_SRC:-${HOME}/.cache/pg_accel/postgres}
      args:
        BASE_IMAGE: pg_accel/vexec-dev:${CHTE_VANILLA_FLAVOR:-vanilla}
    profiles: ["build"]

  vanilla:
    <<: *run
    image: pg_chte/dev:${CHTE_VANILLA_FLAVOR:-vanilla}
    profiles: ["run"]

  chte-dev-official:
    image: pg_chte/dev:official
    build:
      context: .
      dockerfile: Dockerfile.official
      args:
        BASE_IMAGE: ${CHTE_PG_IMAGE:-postgres:19rc1-trixie}
        CHTE_UID: ${CHTE_UID:-1000}
    profiles: ["build"]

  official:
    <<: *run
    image: pg_chte/dev:official
    profiles: ["run"]

  chte-dev-port:
    image: pg_chte/dev:${CHTE_PORT_FLAVOR:-port}-${CHTE_PORT_COMMIT:-unset}
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts:
        pgsrc: ${PG_SRC:-${HOME}/.cache/pg_accel/postgres}
      args:
        BASE_IMAGE: pg_accel/vexec-dev:${CHTE_PORT_FLAVOR:-port}-${CHTE_PORT_COMMIT:-unset}
    profiles: ["build"]

  port:
    <<: *run
    image: pg_chte/dev:${CHTE_PORT_FLAVOR:-port}-${CHTE_PORT_COMMIT:-unset}
    volumes:
      - ..:/src:ro
      - ${CHTE_WORK:-/nonexistent}:/work
      - ${CHTE_DATA:-/nonexistent}:/data:ro
      - ${CHTE_ENGINE_BUILD:-${HOME}/.cache/pg_accel/chte/engine}/lib:/engine:ro
      - ${CHTE_PORT_STAGE:-/nonexistent}:/cbstage:ro
    profiles: ["run"]

  portbuild:
    image: pg_accel/vexec-dev:${CHTE_PORT_FLAVOR:-port}dev-${CHTE_PORT_COMMIT:-unset}
    user: postgres
    network_mode: none
    entrypoint: ["/src/test/portbuild.sh"]
    mem_limit: ${CHTE_PORTBUILD_MEM:-16g}
    memswap_limit: ${CHTE_PORTBUILD_MEM:-16g}
    tmpfs:
      - /tmp:exec
    volumes:
      - ..:/src:ro
      - ${CHTE_PORT_SRC:-/nonexistent}:/cbsrc:ro
      - ${CHTE_PAX_CONTRIB:-/nonexistent}/tabulate:/cbsrc/contrib/pax_storage/src/cpp/contrib/tabulate:ro
      - ${CHTE_PAX_CONTRIB:-/nonexistent}/googletest:/cbsrc/contrib/pax_storage/src/cpp/contrib/googletest:ro
      - ${CHTE_PORT_BUILD:-/nonexistent}:/cbbuild
    environment:
      PORTBUILD_JOBS: ${PORTBUILD_JOBS:-8}
      PORTBUILD_COMMIT: ${PORTBUILD_COMMIT:-unknown}
    profiles: ["run"]

  chte-engine-builder:
    image: pg_chte/engine-builder:clang21
    build:
      context: .
      dockerfile: Dockerfile.engine
    profiles: ["build"]

  engine:
    image: pg_chte/engine-builder:clang21
    profiles: ["run"]
    user: "${CHTE_UID:-1000}:${CHTE_GID:-1000}"
    network_mode: none
    mem_limit: ${CHTE_ENGINE_MEM:-44g}
    memswap_limit: ${CHTE_ENGINE_MEM:-44g}
    tmpfs:
      - /tmp:exec
    volumes:
      - ..:/src:ro
      - ${CHTE_CH_SRC:-${HOME}/.cache/pg_accel/chte/clickhouse-src}:/ch:ro
      - ${CHTE_ENGINE_BUILD:-${HOME}/.cache/pg_accel/chte/engine}:/build
    environment:
      CHTE_ENGINE_JOBS: ${CHTE_ENGINE_JOBS:-16}
      CHTE_ENGINE_TARGETS: ${CHTE_ENGINE_TARGETS:-chte_engine}
      CHTE_ENGINE_RECONFIGURE: ${CHTE_ENGINE_RECONFIGURE:-0}
      CHTE_ENGINE_FRESH: ${CHTE_ENGINE_FRESH:-0}
      CHTE_ENGINE_KEEP_GOING: ${CHTE_ENGINE_KEEP_GOING:-1}
      CHTE_ENGINE_BUILD_TYPE: ${CHTE_ENGINE_BUILD_TYPE:-RelWithDebInfo}
